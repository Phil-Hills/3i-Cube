<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3i-CUBE</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0F172A">

    <style>
      :root {
        --cube-cyan-rgb: 6 182 212;
        --cube-purple-rgb: 168 85 247;
        --cube-blue-rgb: 34 211 238;
      }
      
      :root {
        --cube-cyan: rgb(var(--cube-cyan-rgb));
        --cube-purple: rgb(var(--cube-purple-rgb));
        --cube-blue: rgb(var(--cube-blue-rgb));
        --gradient: linear-gradient(to right, var(--cube-cyan), var(--cube-purple));
      }

      body {
        background-color: #0F172A;
        background-image: radial-gradient(ellipse at top, hsl(220, 40%, 15%) 0%, hsl(220, 40%, 5%) 100%);
        color: #e2e8f0;
      }
      @keyframes fadeIn { 
        from { opacity: 0; transform: translateY(10px); } 
        to { opacity: 1; transform: translateY(0); } 
      }
      .animate-fade-in { 
        animation: fadeIn 0.5s ease-out forwards; 
      }
      .image-modal-backdrop {
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(8px);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        animation: fadeIn 0.2s ease-out;
      }
      .image-modal-content {
        max-width: 90vw;
        max-height: 90vh;
        width: auto;
        height: auto;
        object-fit: contain;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.1",
    "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
    "react/": "https://esm.sh/react@^19.1.1/",
    "@google/genai": "https://esm.sh/@google/genai@^1.15.0",
    "react-markdown": "https://esm.sh/react-markdown@^9.0.1",
    "remark-gfm": "https://esm.sh/remark-gfm@^4.0.0",
    "remarkable": "https://esm.sh/remarkable@^2.0.1",
    "@jest/globals": "https://aistudiocdn.com/@jest/globals@^30.0.5"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
